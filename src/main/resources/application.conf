pekko {
  log-dead-letters = 0
  log-dead-letters-during-shutdown = off
  stdout-loglevel = "OFF"
  loglevel = "INFO"
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"
  actor {
    provider = "cluster"
    serialization-bindings {
      "gameoflife.CborSerializable" = jackson-cbor
    }
  }

  remote.artery {
    canonical {
      hostname = "127.0.0.1"
      port = 0
    }
  }

  cluster {
    seed-nodes = [
      "pekko://TheGameOfLife@127.0.0.1:2551"
    ]
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
  }
}


game-of-life {
  board {
    size {
      x = 6
      y = 6
    }
  }

  simulation {
    wait-for-backends = 5s
    start-delay=1s
    tick = 3000ms
    max-crashes = 100
  }

  errors {
    delay = 10second
    every = 15seconds
  }
}